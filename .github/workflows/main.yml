name: Build GawharaPluginManager

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify plugin JAR
        run: |
          test -s target/GawharaPluginManager-1.0.0.jar
          jar tf target/GawharaPluginManager-1.0.0.jar | grep -q 'plugin.yml'
          jar tf target/GawharaPluginManager-1.0.0.jar | grep -q 'GawharaPluginManager.class'
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: GawharaPluginManager-1.0.0
          path: target/GawharaPluginManager-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
